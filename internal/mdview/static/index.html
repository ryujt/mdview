<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@4/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dockerfile.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/gradle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/dart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/scala.min.js"></script>
</head>
<body>
  <div id="layout">
    <aside id="sidebar" hidden>
      <div id="sidebar-header">
        <span id="sidebar-title">Files</span>
      </div>
      <nav id="tree"></nav>
    </aside>
    <div id="sidebar-resizer" hidden role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize (double-click to reset)"></div>
    <div id="content">
      <header id="header-bar">
        <span id="filename-display"></span>
        <div id="toolbar-actions">
          <div id="export-menu-wrap">
            <button id="export-menu-button" type="button" title="Export the current document" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">Export <span aria-hidden="true">▾</span></button>
            <div id="export-menu" role="menu" aria-label="Export" hidden>
              <button id="export-pdf" type="button" role="menuitem">Save as PDF…</button>
              <button id="export-zip" type="button" role="menuitem">Save as Markdown ZIP…</button>
            </div>
          </div>
          <span id="job-status" hidden></span>
          <span id="record-status" hidden>
            <span id="record-indicator" aria-hidden="true"></span>
            <span id="record-timer">00:00</span>
            <span id="record-level" title="Microphone input level" aria-hidden="true"><span id="record-level-bar"></span></span>
            <span id="record-events" title="Number of recorded events"></span>
          </span>
          <select id="record-device" title="Select recording input device" aria-label="Select recording input device"></select>
          <button id="record-button" type="button" title="Start audio recording" aria-label="Start audio recording" aria-pressed="false">
            <span class="rec-icon" aria-hidden="true"></span>
          </button>
        </div>
      </header>
      <main>
        <div id="empty-state" hidden>Select a file from the sidebar on the left.</div>
        <div id="preview"></div>
      </main>
    </div>
  </div>
  <button id="settings-button" type="button" aria-label="OpenAI settings" title="OpenAI settings" aria-haspopup="dialog" aria-controls="settings-dialog">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="m9 3-.6 2.2-2 .9-2-.7-2 3.4 1.6 1.6-.2 2.2-1.5 1.5 2 3.5 2.1-.6 1.8 1 .5 2.1h4l.6-2.2 2-.9 2 .7 2-3.4-1.6-1.6.2-2.2 1.5-1.5-2-3.5-2.1.6-1.8-1L13 3Z"/>
      <circle cx="11.5" cy="11.5" r="3"/>
    </svg>
  </button>
  <dialog id="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-description">
    <form id="settings-form" autocomplete="off">
      <div class="settings-heading">
        <div>
          <h2 id="settings-title">OpenAI settings</h2>
          <p id="settings-description">Used to transcribe recorded audio to text.</p>
        </div>
        <button id="settings-close" class="settings-icon-button" type="button" aria-label="Close settings">×</button>
      </div>
      <fieldset id="settings-fields" disabled>
        <label for="settings-api-key">OpenAI API key <span id="settings-key-badge"></span></label>
        <div class="settings-key-input">
          <input id="settings-api-key" type="password" name="mdview-api-key" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="sk-…" maxlength="4096" aria-describedby="settings-key-help" />
          <button id="settings-key-visibility" type="button" aria-label="Show entered API key" aria-pressed="false">Show</button>
        </div>
        <p id="settings-key-help" class="settings-hint"></p>
        <button id="settings-key-clear" class="settings-text-button" type="button" disabled>Delete saved key</button>
        <label for="settings-model" class="settings-model-label">Transcription model</label>
        <select id="settings-model" aria-describedby="settings-model-help"></select>
        <p id="settings-model-help" class="settings-hint"></p>
      </fieldset>
      <p class="settings-privacy">Settings are saved to your user account on this computer. When transcription is used, recordings are sent to OpenAI and API usage fees may apply.</p>
      <p id="settings-message" role="status" aria-live="polite"></p>
      <div class="settings-actions">
        <button id="settings-cancel" type="button">Close</button>
        <button id="settings-save" class="settings-primary" type="submit" disabled>Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
